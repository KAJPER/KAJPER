name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Optional: add a classic PAT (scopes: repo, read:user) as the STATS_TOKEN
      # secret to include private repositories. Without it GITHUB_TOKEN is used.
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&border_radius=12&bg_color=161b22&title_color=22d3ee&icon_color=22d3ee&text_color=c9d1d9&ring_color=22d3ee
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide_border=true&border_radius=12&bg_color=161b22&title_color=22d3ee&text_color=c9d1d9&card_width=340
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&border_radius=12&background=161b22&stroke=30363d&ring=22d3ee&fire=22d3ee&currStreakNum=ffffff&sideNums=ffffff&currStreakLabel=22d3ee&sideLabels=c9d1d9&dates=8b949e&timezone=Europe/Warsaw
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#0f172a&color_dots=#ebedf0,#a5f3fc,#22d3ee,#0891b2,#155e75
            profile/snake-dark.svg?palette=github-dark&color_snake=#f0f6fc&color_dots=#161b22,#164e63,#0e7490,#06b6d4,#67e8f9

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git commit -m "Update profile cards" || exit 0
          git push
